name: Generate DishTV EPG

on:
  schedule:
    - cron: '30 1 * * *'  # दररोज सकाळी ७:०० वाजता IST (UTC नुसार 1:30)
  workflow_dispatch: # हाताने देखील रन करण्यासाठी बटन मिळेल

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        pip install urllib3

    - name: Run EPG Script
      run: |
        python generate_epg.py

    - name: Commit and push changes
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "Auto-update DishTV EPG XML"
        file_pattern: epg/dishtv.xml epg/dishtv.xml.gz
        
